name: Update API references
on:
  push:
    branches: [master]
    paths: ['LLama/**']
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  update_api_references:
    if: github.repository == 'SciSharp/LLamaSharp'
    name: Update API References
    runs-on: ubuntu-22.04

    steps:
    - uses: actions/checkout@v6
      with:
        token: ${{ secrets.REPO_TOKEN || github.token }}
    - uses: actions/setup-dotnet@v4
      with:
        dotnet-version: |
          8.0.x
          10.0.x
    - name: install_tool_and_generate_api_docs
      run: |
        dotnet tool install -g XMLDoc2Markdown
        dotnet build ./LLama/LLamaSharp.csproj
        cd LLama/bin/Debug/net8.0
        rm -rf ../../../../docs/xmldocs
        xmldoc2md LLamaSharp.dll -o ../../../../docs/xmldocs --back-button
        # XMLDoc2Markdown 6 also writes the compiler's fixed buffer types, named like <key>e__FixedBuffer,
        # which Windows cannot check out
        find ../../../../docs/xmldocs -name '*[<>]*' -delete
        sed -i '/e__fixedbuffer\.md)/d' ../../../../docs/xmldocs/index.md
    
    - name: Commit and push changes
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "AsakusaRinne@gmail.com"
        git add docs/xmldocs
        if git diff --cached --quiet; then
          echo "No changes to commit."
          exit 0
        fi
        echo "Current git status:"
        git status
        echo "Modified files:"
        git diff --cached --name-only
        git commit -m "chore(docs): update API references in the github action."
        git push

